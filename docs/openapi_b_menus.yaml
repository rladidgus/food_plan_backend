openapi: 3.0.3
info:
  title: Menu Collection API (Node B)
  version: "1.0.0"
servers:
  - url: /api/v1
paths:
  /menus/collect:
    post:
      summary: Create menu collection job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuCollectRequest"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuCollectResponse"
        "400":
          description: Invalid request
  /menus/collect/{job_id}:
    get:
      summary: Get job status
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "404":
          description: Job not found
  /menus/collect/{job_id}/failures:
    get:
      summary: Get job failures
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Failure list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobFailuresResponse"
        "404":
          description: Job not found
  /restaurants/{restaurant_id}/menus:
    get:
      summary: Get menus for a restaurant
      parameters:
        - name: restaurant_id
          in: path
          required: true
          schema:
            type: integer
        - name: include_source
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: include_confidence
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Menu list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantMenusResponse"
        "404":
          description: Restaurant not found
components:
  schemas:
    MenuCollectRequest:
      type: object
      required:
        - restaurant_ids
      properties:
        restaurant_ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer
        collection_method_priority:
          type: array
          items:
            type: string
            enum: [SCRAPING, LLM, API]
          default: [SCRAPING, LLM, API]
        rate_limit_ms:
          type: integer
          minimum: 0
          maximum: 5000
          default: 800
        naver_validation:
          type: boolean
          default: true
        llm_fallback:
          type: boolean
          default: true
    MenuCollectResponse:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued]
        requested_count:
          type: integer
        created_at:
          type: string
    JobStatusResponse:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, partial]
        requested_count:
          type: integer
        success_count:
          type: integer
        failure_count:
          type: integer
        started_at:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true
        errors:
          type: array
          items:
            type: string
    MenuItemOut:
      type: object
      properties:
        menu_id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
        collection_method:
          type: string
          nullable: true
        source_url:
          type: string
          nullable: true
        confidence:
          type: number
          nullable: true
    RestaurantMenusResponse:
      type: object
      properties:
        restaurant_id:
          type: integer
        menus:
          type: array
          items:
            $ref: "#/components/schemas/MenuItemOut"
        updated_at:
          type: string
          nullable: true
    JobFailuresResponse:
      type: object
      properties:
        job_id:
          type: string
        failures:
          type: array
          items:
            type: object
            properties:
              restaurant_id:
                type: string
              stage:
                type: string
              reason:
                type: string
              detail:
                type: string
